name: Get Citation Data

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/google_scholar_crawler.yaml"
      - "google_scholar_crawler/**"
  schedule:
    # Run away from the top of the hour, when scheduled Actions are most delayed.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: true

jobs:
  build:
    # Direct Scholar requests from GitHub-hosted runners are routinely blocked.
    # SerpApi provides a stable Scholar Author endpoint from its free plan.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test citation parser
        run: python -m unittest discover -s google_scholar_crawler -p "test_*.py"

      - name: Check Scholar API configuration
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          if [ -z "${SERPAPI_API_KEY}" ]; then
            echo "Missing repository secret: SERPAPI_API_KEY" >&2
            echo "Create a free key at https://serpapi.com/ and add it under" >&2
            echo "Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Restore previous citation data
        continue-on-error: true
        working-directory: google_scholar_crawler
        run: |
          mkdir -p results
          curl --fail --location --silent --show-error --retry 3 \
            --output results/gs_data.json \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/google-scholar-stats/gs_data.json"

      - name: Fetch and validate citation data
        working-directory: google_scholar_crawler
        run: python main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SCHOLAR_MAX_ATTEMPTS: "3"
          SCHOLAR_ATTEMPT_TIMEOUT_SECONDS: "40"
          SCHOLAR_HTTP_TIMEOUT_SECONDS: "30"

      - name: Publish citation data
        working-directory: google_scholar_crawler/results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Updated Citation Data"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force

name: Get Citation Data

on:
  schedule:
    # Run away from the top of the hour, when scheduled Actions are most delayed.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test citation parser
        run: python -m unittest discover -s google_scholar_crawler -p "test_*.py"

      - name: Restore previous citation data
        continue-on-error: true
        working-directory: google_scholar_crawler
        run: |
          mkdir -p results
          curl --fail --location --silent --show-error --retry 3 \
            --output results/gs_data.json \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/google-scholar-stats/gs_data.json"

      - name: Fetch and validate citation data
        working-directory: google_scholar_crawler
        run: python main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          SCHOLAR_MAX_ATTEMPTS: "4"
          SCHOLAR_ATTEMPT_TIMEOUT_SECONDS: "45"
          SCHOLAR_HTTP_TIMEOUT_SECONDS: "30"

      - name: Publish citation data
        working-directory: google_scholar_crawler/results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Updated Citation Data"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force

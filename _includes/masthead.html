<nav class="site-navbar">
  <div class="site-navbar__inner">
    <a class="site-navbar__brand" href="{{ '/' | relative_url }}">Zhen (Vincent) Sun</a>
    <button class="site-navbar__toggle" type="button" aria-label="Menu" onclick="this.nextElementSibling.classList.toggle('is-open')">&#9776;</button>
    <div class="site-navbar__links">
      {% for link in site.data.navigation.main %}
        {% if link.url == "/" %}
          <a href="{{ '/' | relative_url }}">{{ link.title }}</a>
        {% else %}
          <a href="{{ link.url }}">{{ link.title }}</a>
        {% endif %}
      {% endfor %}
    </div>
  </div>
</nav>
